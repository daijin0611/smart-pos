version: '3.8'

services:
  pos-app:
    build:
      context: ../..
      dockerfile: deploy/shared/Dockerfile.multistage
    image: pos-java:prod
    container_name: pos-app-prod
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - app_logs:/tmp/logs
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  app_logs:
    driver: local
