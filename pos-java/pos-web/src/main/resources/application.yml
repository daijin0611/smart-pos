server:
  port: 8080
  servlet:
    context-path: /api # 设置应用的上下文路径为 /api
spring:
  data: # 数据配置
    redis: # Redis配置
      host: 39.107.119.113  # Redis主机地址
      port: 6379  # Redis端口号
      username: admin  # Redis用户名
      password: aA123456@   # 访问Redis所需密码
      database: 0  # 使用的数据库编号
      timeout: 10000ms  # 连接超时时间
      connect-timeout: 10000ms  # 连接建立超时时间
      lettuce: #Lettuce客户端配置
        pool: # 连接池配置
          max-active: 20  # 最大活跃连接数
          max-wait: 10000ms  # 最大等待时间
          max-idle: 10  # 最大空闲连接数
          min-idle: 5  # 最小空闲连接数
          time-between-eviction-runs: 30000ms  # 空闲连接检测周期
        shutdown-timeout: 100ms  # 关闭超时时间
        cluster:
          refresh:
            adaptive: true  # 自适应刷新
            period: 30000ms  # 刷新周期

  jackson:
    time-zone: GMT+8  # 设置 Jackson 的时区为 GMT+8
    date-format: yyyy-MM-dd HH:mm:ss  # 设置 Jackson 的日期格式

  datasource: # 数据源配置
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://39.107.119.113:3366/pos?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: aA123456@
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 10  # 连接池初始化大小
      max-active: 100  # 连接池最大连接数
      max-wait: 60000  # 等待连接池分配连接的最大时长（毫秒），超过这个时长还没可用的连接则发生SQLException
      min-idle: 10  # 最小空闲连接数
      test-while-idle: true  # 连接空闲时进行连接有效性检查
      min-evictable-idle-time-millis: 300000  # 连接在连接池中的最小生存时间（毫秒），达到此值后连接将被释放
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*   #druid监控页面地址
        reset-enable: false
        login-username: druid
        login-password: druid
      # 配置监控过滤器
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: '*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*'
  security: # 安全配置
    jwt:
      key: abcdefghijklmnopqrstuvwxyz1234567890  # JWT密钥
      expire: 7
  transaction:
    rollback-on-commit-failure: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: org.haut.controller
    - group: 'system'
      paths-to-match: '/system/**'
      packages-to-scan: org.haut.controller.system
    - group: 'room'
      paths-to-match: '/room/**'
      packages-to-scan: org.haut.controller.room
    - group: 'server'
      paths-to-match: '/server/**'
      packages-to-scan: org.haut.controller.server
    - group: 'vip'
      paths-to-match: '/vip/**'
      packages-to-scan: org.haut.controller.vip
  default-flat-param-object: true
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn


logging:
  level:
    com.baomidou.mybatisplus: DEBUG
    org.mybatis: DEBUG
    org.apache.ibatis: DEBUG
    java.sql: DEBUG
    javax.sql: DEBUG
